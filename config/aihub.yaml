environment: local

runtime:
  logging:
    level: info
    directory: logs

services:
  email:
    enabled: false
    provider: nylas

providers:
  nylas:
    enabled: false
    config_source: environment
    api_uri_env: NYLAS_API_URI
    api_key_env: NYLAS_API_KEY
    grant_id_env: NYLAS_GRANT_ID
    default_account: default
    accounts:
      - id: default
        label: Default mailbox
        grant_id_env: NYLAS_GRANT_ID
      - id: personal
        label: Personal mailbox
        grant_id_env: NYLAS_GRANT_ID_PERSONAL
      - id: work
        label: Work mailbox
        grant_id_env: NYLAS_GRANT_ID_WORK
    allowed_operations:
      - read_messages

secrets:
  policy: environment-or-local-secret-store
  committed_secrets_allowed: false
